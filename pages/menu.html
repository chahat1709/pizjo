<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://images.unsplash.com https://*.unsplash.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://pizjoadmin-9mxbkqqm.manus.space; object-src 'none'; frame-src https://www.google.com https://www.google.com/maps/; base-uri 'self'; form-action 'self' https://wa.me;">

    <title>Menu — Pizjo | 155+ Items, 15 Categories | Pizza, Burger, Momos</title>
    <meta name="description"
        content="Browse Pizjo's full menu — 155+ items across 15 categories. Pizza, Calizza, Burgers, Momos, French Fries, Garlic Breads, Calzone, Pastas, Desserts & Coolers. Starting at ₹49.">

    <link rel="icon" href="../assets/pizjo_logo.webp" type="image/webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;800;900&family=Hanken+Grotesk:wght@400;500;700&family=Caveat:wght@700&family=Permanent+Marker&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/tokens.css?v=5">
    <link rel="stylesheet" href="../css/global.css?v=5">
    <link rel="stylesheet" href="../css/menu.css?v=5">
</head>

<body class="bg-off-white text-umber-raw antialiased relative min-h-screen overflow-x-hidden">
    <a href="#menu-hero" class="skip-to-content">Skip to content</a>

    <!-- Nav -->
    <nav class="navbar" role="navigation" aria-label="Primary">
        <div class="container nav-container">
            <a href="../index.html" class="nav-brand" aria-label="Pizjo home">
                <img src="../assets/pizjo_logo.webp" alt="Pizjo Logo" class="brand-logo">
                <span class="brand-text">PIZJO!</span>
            </a>
            <div class="nav-links" id="nav-links">
                <a href="../index.html#menu" class="nav-link">Menu</a>
                <a href="../index.html#offers" class="nav-link">Offers</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
            <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-controls="nav-links" aria-label="Toggle menu" aria-expanded="false">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div class="nav-actions">
                <button class="cart-toggle" id="cart-toggle" aria-label="Open cart">
                    CART
                    <div class="cart-icon-wrapper">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span class="cart-badge" id="cart-count">0</span>
                    </div>
                </button>
            </div>
        </div>
    </nav>

    <!-- Sliding cart -->
    <div class="cart-overlay" id="cart-overlay" hidden></div>
    <aside class="cart-sidebar" id="cart-sidebar" role="dialog" aria-modal="true" aria-label="Shopping cart" aria-hidden="true" inert>
        <div class="cart-header">
            <h2>Your Stash</h2>
            <button class="cart-close" id="cart-close" aria-label="Close cart">&times;</button>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- Dynamic Cart Items -->
        </div>
        <div class="cart-footer">
            <div class="cart-total-row"><span>Total</span><span id="cart-total">₹0</span></div>
            <button class="btn cart-checkout-btn" id="checkout-btn">
                Order on WhatsApp
            </button>
        </div>
    </aside>

    <!-- ═══════════ MENU HERO ═══════════ -->
    <section class="menu-hero" id="menu-hero" style="margin-top: calc(var(--nav-height)); padding-top: var(--space-4xl);">
        <div class="section-container">
            <nav class="breadcrumb" aria-label="Breadcrumb">
                <a href="../index.html">Home</a>
                <span class="breadcrumb-sep">/</span>
                <span class="breadcrumb-current">Menu</span>
            </nav>
            <h1 class="menu-hero-title reveal">Our Menu</h1>
            <p class="menu-hero-subtitle reveal">155+ items across 15 categories. All pure veg. All delicious.</p>
            <div class="menu-search reveal" id="menu-search-wrapper">
                <svg class="menu-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="menu-search" class="menu-search-input"
                    placeholder="Search pizza, burger, momos..." autocomplete="off" maxlength="100"
                    aria-label="Search menu items">
            </div>
        </div>
    </section>

    <!-- ═══════════ MENU BODY ═══════════ -->
    <section class="menu-body section-container">
        <!-- Sidebar Category Nav (Desktop) -->
        <aside class="menu-sidebar" id="menu-sidebar" aria-label="Menu categories">
            <div class="sidebar-inner" id="sidebar-categories">
                <!-- Rendered by JS -->
            </div>
        </aside>

        <!-- Category Tabs (Mobile) -->
        <div class="menu-tabs-mobile" id="menu-tabs-mobile">
            <!-- Rendered by JS -->
        </div>

        <!-- Menu Items Grid -->
        <main class="menu-main" id="menu-main">
            <div class="menu-loading" id="menu-loading">
                <div class="skeleton-grid">
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
            </div>
            <div id="menu-sections">
                <!-- Rendered by JS -->
            </div>
            <div class="menu-empty" id="menu-empty" style="display:none;">
                <div class="empty-state">
                    <span class="empty-icon">🔍</span>
                    <h3>No items found</h3>
                    <p>Try a different search term</p>
                    <button class="btn btn-outline btn-sm" id="clear-search">Clear Search</button>
                </div>
            </div>
        </main>
    </section>

    <script src="../js/config.js?v=2"></script>
    <script src="../js/security.js?v=5"></script>
    <script src="../js/catalog.js?v=1"></script>
    <script src="../js/site.js?v=1"></script>
    <script src="../js/admin-storefront-sync.js?v=1"></script>
    <script type="module" src="../js/app.js?v=12"></script>
    <script src="menu.js?v=2"></script>

    <!-- Floating WhatsApp Button -->
    <a data-whatsapp-link data-whatsapp-message="Hi! I'd like to place an order 🍕" href="#" target="_blank" rel="noopener noreferrer" class="whatsapp-float" aria-label="Chat on WhatsApp" style="position: fixed; bottom: var(--space-xl); right: var(--space-xl); z-index: 1000; display: flex; align-items: center; justify-content: center; width: 60px; height: 60px; background: #25D366; color: white; border-radius: 50%; box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4); animation: pulse 2s infinite; text-decoration: none; transition: transform var(--duration-fast), box-shadow var(--duration-fast);">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <style>
            @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); } }
            .whatsapp-float:hover { transform: scale(1.1); box-shadow: 0 6px 25px rgba(37, 211, 102, 0.5); }
            @media (max-width: 480px) { .whatsapp-float { bottom: var(--space-lg); right: var(--space-lg); width: 52px; height: 52px; } }
        </style>
    </a>
</body>
</html>
